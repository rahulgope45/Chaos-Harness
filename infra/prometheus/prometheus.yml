global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: payment-api
    static_configs:
      - targets: ["payment-api:3000"]
  - job_name: payment-worker
    static_configs:
      - targets: ["payment-worker:3001"]
