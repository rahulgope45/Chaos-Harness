groups:
  - name: payment-red
    rules:
      - record: payment_api:http_error_rate:ratio5m
        expr: >-
          sum(rate(payment_api_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(payment_api_http_requests_total[5m])), 0.000001)
      - record: payment_api:http_request_p95_seconds:5m
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(payment_api_http_request_duration_seconds_bucket[5m])))
      - record: payment_api:http_throughput:requests_per_second5m
        expr: sum(rate(payment_api_http_requests_total[5m]))
