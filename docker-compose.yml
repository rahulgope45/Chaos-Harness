name: chaos-harness

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaos}
      POSTGRES_DB: ${POSTGRES_DB:-chaos_harness}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - chaos-network

  redis:
    image: redis:8.10.2-alpine3.23
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    labels:
      chaos-target: "true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - chaos-network

  prometheus:
    image: prom/prometheus:v3.15.0-busybox
    restart: "no"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - chaos-network

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    restart: "no"
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8666-8670:8666-8670"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "--host", "http://127.0.0.1:8474", "list"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - chaos-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  chaos-network:
    name: chaos-harness-network
