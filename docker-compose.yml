name: chaos-harness

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaos}
      POSTGRES_DB: ${POSTGRES_DB:-chaos_harness}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - chaos-network

  redis:
    image: redis:8.10.2-alpine3.23
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    labels:
      chaos-target: "true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - chaos-network

  prometheus:
    image: prom/prometheus:v3.15.0-busybox
    restart: "no"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - chaos-network

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    restart: "no"
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8666-8670:8666-8670"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "--host", "http://127.0.0.1:8474", "list"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - chaos-network

  webhook-sink:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "start", "--workspace", "@chaos/webhook-sink"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaos}:${POSTGRES_PASSWORD:-chaos}@postgres:5432/${POSTGRES_DB:-chaos_harness}
      REDIS_URL: redis://redis:6379
      WEBHOOK_SINK_PORT: 3002
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${WEBHOOK_SINK_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - chaos-network

  payment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "start", "--workspace", "@chaos/payment-worker"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaos}:${POSTGRES_PASSWORD:-chaos}@postgres:5432/${POSTGRES_DB:-chaos_harness}
      REDIS_URL: redis://redis:6379
      WEBHOOK_SINK_URL: http://webhook-sink:3002
      WORKER_CONCURRENCY: 4
      LOG_LEVEL: info
    labels:
      chaos-target: "true"
    depends_on:
      redis:
        condition: service_healthy
      webhook-sink:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - chaos-network

  payment-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "start", "--workspace", "@chaos/payment-api"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaos}:${POSTGRES_PASSWORD:-chaos}@postgres:5432/${POSTGRES_DB:-chaos_harness}
      REDIS_URL: redis://redis:6379
      PROMETHEUS_URL: http://prometheus:9090
      PAYMENT_API_PORT: 3000
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${PAYMENT_API_PORT:-3000}:3000"
    labels:
      chaos-target: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      webhook-sink:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - chaos-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  chaos-network:
    name: chaos-harness-network
