name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait postgres redis

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://chaos:chaos@127.0.0.1:5432/chaos_harness
        run: npm run generate --workspace @chaos/database

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://chaos:chaos@127.0.0.1:5432/chaos_harness
        run: npm run migrate:deploy --workspace @chaos/database

      - name: Run live integration tests
        run: npm run test:integration

      - name: Capture integration dependency logs
        if: always()
        run: docker compose logs --no-color postgres redis > integration-services.log

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-services
          path: integration-services.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop integration dependencies
        if: always()
        run: docker compose down

  chaos-smoke:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run one-command smoke chaos demo
        run: npm run demo

      - name: Capture final Compose state and logs
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker compose ps --all > ci-artifacts/compose-ps.txt
          docker compose logs --no-color > ci-artifacts/compose.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-smoke-evidence
          path: |
            docs/results/experiments/ci-smoke-worker-kill-*/
            ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop smoke stack
        if: always()
        run: docker compose down
