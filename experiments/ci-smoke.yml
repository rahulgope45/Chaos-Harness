name: ci-smoke-worker-kill
hypothesis: "A short worker kill is reverted and loses no acknowledged payment event."
target: payment-worker
fault: FS_1
fs1:
  action: kill
  inject_after_s: 1
seed: 2001
repeat: 1
duration_s: 5
rate_per_second: 10
invariant_drain_timeout_s: 30
max_duration_s: 60
recovery:
  timeout_s: 15
  consecutive_healthy: 2
steady_state:
  max_error_rate: 0.02
abort_if:
  error_rate_above: 0.50
invariants: [I1, I2, I3, I4, I5, I6]
