name: no-fault-control
hypothesis: "The harness introduces no failures when no fault is injected."
target: payment-api
fault: none
seed: 100
repeat: 1
duration_s: 5
rate_per_second: 10
max_duration_s: 60
recovery:
  timeout_s: 10
  consecutive_healthy: 2
steady_state:
  max_error_rate: 0.02
abort_if:
  error_rate_above: 0.10
invariants: [I1, I2, I3, I4, I5, I6]
