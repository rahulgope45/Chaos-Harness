name: controller-restart-during-worker-outage
hypothesis: "A restarted controller observes and recovers an already-killed worker without violating payment invariants."
target: payment-worker
fault: FS_1
fs1:
  action: kill
  inject_after_s: 2
controller:
  enabled: true
  port: 3100
  restart_during_outage: true
seed: 1901
repeat: 1
duration_s: 10
rate_per_second: 50
invariant_drain_timeout_s: 60
duplicate_observation_s: 0
max_duration_s: 120
recovery:
  timeout_s: 30
  consecutive_healthy: 2
steady_state:
  max_error_rate: 0.02
abort_if:
  error_rate_above: 0.1
invariants: [I1, I2, I3, I4, I5, I6]
